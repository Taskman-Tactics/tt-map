<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add a COG raster source</title>
    <meta property="og:description" content="Add an external Cloud Optimized Geotiff (COG) as source." />
    <meta property="og:category" content="Raster & Imagery" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css" />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/@geomatico/maplibre-cog-protocol@0.5.0/dist/index.js"></script>
<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs';

	maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

	const WIDTH_DEGREES = 2;
	const HEIGHT_DEGREES = WIDTH_DEGREES / 4 * 3;
	const MARGIN_MULT = 1;

	// const WIDTH_DEGREES = 100;
	// const HEIGHT_DEGREES = WIDTH_DEGREES / 4 * 3;
	// const MARGIN_MULT = 0.5;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/styles/osm-bright-gl-style/style.json',
		zoom: 5,
		center: [0, 0],
		// maxBounds: [
		// 	[-WIDTH_DEGREES * MARGIN_MULT, -HEIGHT_DEGREES * MARGIN_MULT],
		// 	[ WIDTH_DEGREES * MARGIN_MULT,  HEIGHT_DEGREES * MARGIN_MULT],
		// ]
    });

    map.on('load', () => {
        // map.addSource('cogSource', {
        //     type: 'image',
        //     url: './assets/basemap.jpg',
		// 	coordinates: [
		// 		[-WIDTH_DEGREES / 2,  HEIGHT_DEGREES / 2],
		// 		[ WIDTH_DEGREES / 2,  HEIGHT_DEGREES / 2],
		// 		[ WIDTH_DEGREES / 2, -HEIGHT_DEGREES / 2],
		// 		[-WIDTH_DEGREES / 2, -HEIGHT_DEGREES / 2]
		// 	]
        // });

		map.addSource('cogSource', {
			type: 'raster',
			url: 'cog://./assets/basemap.tif',
			tileSize: 256
		});

        map.addLayer({
            id: 'cogLayer',
            source: 'cogSource',
            type: 'raster'
        });
    });
</script>
</body>
</html>
